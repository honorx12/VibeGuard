[project]
name = "ai-web-quality-skills"
version = "0.1.0"
description = "Validated library of SKILL.md files for AI coding agents, with local validation, scanning and discovery tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["tests/security-test-cases", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # long regex/data lines
"tests/*" = ["E501"]
